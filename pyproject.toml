[project]
name = "netlist-converter"
version = "0.1.0"
description = "Circuit datasheet/image to netlist converter with local LLM support"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.4",
    "langchain>=0.3",
    "langchain-ollama>=0.3",
    "langchain-chroma>=0.2",
    "langchain-community>=0.3",
    "chromadb>=0.5",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "jinja2>=3.1",
    "typer>=0.15",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pymupdf>=1.25",
    "pillow>=11.0",
    "schemdraw>=0.19",
    "aiosqlite>=0.20",
    "python-multipart>=0.0.18",
    "httpx>=0.28",
    "rich>=13.9",
]

[project.optional-dependencies]
cloud = [
    "langchain-openai>=0.3",
    "langchain-anthropic>=0.3",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[project.scripts]
netlist = "netlist_converter.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netlist_converter"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
