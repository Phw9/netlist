<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Netlist Converter{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">Netlist Converter</a>
            <div class="nav-links">
                <a href="/">Convert</a>
                <a href="/history">History</a>
            </div>
        </div>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">
        <div class="container">
            <p>Netlist Converter v0.1.0 &mdash; Local LLM Powered Circuit Analysis</p>
        </div>
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
